function physics(dt){
if(state.paused)return;
if(state.absorbed){state.absorb=Math.min(1,state.absorb+dt*2.2);return;}
if(state.grounded)return;
const dragAccel=state.k*state.v*Math.abs(state.v);
const accel=state.g*1-dragAccel;
state.v+=accel*dt;
state.y-=state.v*dt;
state.elapsed+=dt;
if(state.y<=0){
state.y=0;
if(state.planet==='blackhole'){state.absorbed=true;state.absorb=0;state.v=0;return;}
const rebound=Math.abs(state.v)*state.bounce;
const threshold=Math.max(.12,state.g*dt*1.2);
const bounceHeight=state.g>0?rebound*rebound/(2*state.g):0;
if(rebound<threshold||bounceHeight<.025){state.v=0;state.grounded=true;}
else state.v=-rebound;
}
if(state.y>MAX){state.y=MAX;state.v=0;}
if(state.elapsed>360){state.v=0;state.grounded=true;}
graphData.push({t:state.elapsed,h:state.y,v:state.v,a:accel});
if(graphData.length>2400)graphData.shift();
}

function drawGraph(canvas,key,color){
const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height,pad={l:48,r:12,t:12,b:30};c.clearRect(0,0,w,h);c.fillStyle='#101018';c.fillRect(0,0,w,h);
const data=graphData;if(!data.length)return;let xmax=Math.max(1,data[data.length-1].t),vals=data.map(d=>d[key]);let ymin=Math.min(0,...vals),ymax=Math.max(1,...vals);if(ymax-ymin<1){ymax=ymin+1;}
if(key==='h'){ymin=0;ymax=Math.max(10,state.height*1.05);}if(key==='v'){ymin=Math.min(0,ymin);ymax=Math.max(1,ymax*1.1);}if(key==='a'){const ext=Math.max(1,Math.abs(ymin),Math.abs(ymax));ymin=-ext*1.1;ymax=ext*1.1;}
const X=t=>pad.l+(t/xmax)*(w-pad.l-pad.r),Y=v=>h-pad.b-((v-ymin)/(ymax-ymin))*(h-pad.t-pad.b);
c.strokeStyle='#ffffff18';c.lineWidth=1;c.fillStyle='#a1a1aa';c.font='11px system-ui';c.textAlign='center';for(let i=0;i<=4;i++){let xx=pad.l+i*(w-pad.l-pad.r)/4;c.beginPath();c.moveTo(xx,pad.t);c.lineTo(xx,h-pad.b);c.stroke();c.fillText((xmax*i/4).toFixed(xmax<10?1:0),xx,h-9);}
c.textAlign='right';for(let i=0;i<=4;i++){let val=ymin+(ymax-ymin)*i/4,yy=Y(val);c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke();c.fillText(val.toFixed(key==='h'?0:1),pad.l-6,yy+4);}
c.strokeStyle=color;c.lineWidth=2.5;c.lineJoin='round';c.beginPath();data.forEach((d,i)=>i?c.lineTo(X(d.t),Y(d[key])):c.moveTo(X(d.t),Y(d[key])));c.stroke();
const d=data[data.length-1];c.fillStyle=color;c.beginPath();c.arc(X(d.t),Y(d[key]),3.5,0,Math.PI*2);c.fill();
}

function endGame(){game.active=false;game.over=true;$('finalScore').textContent=timeText(game.t);if(game.t>game.best){game.best=game.t;localStorage.setItem('freeFallMiniBest',game.best.toFixed(2));$('bestTime').textContent=game.best.toFixed(2)+'s';$('recordMessage').textContent='🎉 최고 기록 갱신!';}else $('recordMessage').textContent='최고 기록: '+game.best.toFixed(2)+'초';$('gameOverlay').classList.add('show');saveScore();}
async function loadRanking(mode){rankMode=mode;$('rankEasy').classList.toggle('active',mode==='easy');$('rankHard').classList.toggle('active',mode==='hard');$('rankStatus').textContent=db?'랭킹 불러오는 중…':'Firebase 연결에 실패했습니다.';$('rankList').replaceChildren();if(!db)return;try{const snap=await db.collection('rankings').where('mode','==',mode).orderBy('survivalTime','desc').limit(10).get();if(snap.empty){$('rankStatus').textContent='아직 기록이 없습니다. 첫 기록을 만들어 보세요!';return;} $('rankStatus').textContent=mode==='easy'?'이지 모드 상위 10개 기록':'하드 모드 상위 10개 기록';snap.forEach((doc,i)=>{const d=doc.data(),li=document.createElement('li'),name=document.createElement('span'),score=document.createElement('strong');name.textContent=(i+1)+'위 · '+(d.nickname||'익명');score.textContent=timeText(Number(d.survivalTime||0));li.append(name,score);$('rankList').append(li);});}catch(e){console.error(e);$('rankStatus').textContent='랭킹을 불러오지 못했습니다. Firestore 규칙/색인을 확인해 주세요.';}}
function showRanking(){ $('rankingPanel').hidden=false;loadRanking(rankMode);$('rankingPanel').scrollIntoView({behavior:'smooth',block:'start'});}
function hideRanking(){$('rankingPanel').hidden=true;}
function spawnObstacle(){const shapes=['rect','circle','triangle','bar'];const shape=shapes[Math.floor(Math.random()*shapes.length)];let w=shape==='bar'?110:shape==='circle'?38:Math.random()*46+35;let h=shape==='bar'?24:shape==='circle'?38:Math.random()*36+35;game.obstacles.push({x:Math.random()*(GW-w-30)+15,y:-h-10,w,h,shape,angle:Math.random()*Math.PI*2});}
function drawObstacle(o){gctx.save();gctx.fillStyle='#fb7185';gctx.strokeStyle='#fecdd3';gctx.lineWidth=2;gctx.shadowColor='#fb7185';gctx.shadowBlur=12;gctx.beginPath();if(o.shape==='circle')gctx.arc(o.x+o.w/2,o.y+o.h/2,o.w/2,0,Math.PI*2);else if(o.shape==='triangle'){gctx.moveTo(o.x+o.w/2,o.y);gctx.lineTo(o.x+o.w,o.y+o.h);gctx.lineTo(o.x,o.y+o.h);gctx.closePath();}else if(o.shape==='bar'){gctx.roundRect(o.x,o.y,o.w,o.h,9);}else gctx.roundRect(o.x,o.y,o.w,o.h,7);gctx.fill();gctx.stroke();gctx.restore();}
function collide(o){const cx=player.x,cy=player.y,closestX=Math.max(o.x,Math.min(cx,o.x+o.w)),closestY=Math.max(o.y,Math.min(cy,o.y+o.h));return (cx-closestX)**2+(cy-closestY)**2<player.r**2;}
function gameDraw(){gctx.clearRect(0,0,GW,GH);const bg=gctx.createLinearGradient(0,0,0,GH);bg.addColorStop(0,'#101827');bg.addColorStop(1,'#0b1220');gctx.fillStyle=bg;gctx.fillRect(0,0,GW,GH);gctx.strokeStyle='#ffffff0c';for(let x=0;x<GW;x+=50){gctx.beginPath();gctx.moveTo(x,0);gctx.lineTo(x,GH);gctx.stroke();}for(let y=0;y<GH;y+=50){gctx.beginPath();gctx.moveTo(0,y);gctx.lineTo(GW,y);gctx.stroke();}
// Player y fixed; only x changes
gctx.save();gctx.shadowColor='#38bdf8';gctx.shadowBlur=20;const gr=gctx.createRadialGradient(player.x-5,player.y-5,2,player.x,player.y,player.r);gr.addColorStop(0,'#e0f2fe');gr.addColorStop(.5,'#38bdf8');gr.addColorStop(1,'#0369a1');gctx.fillStyle=gr;gctx.beginPath();gctx.arc(player.x,player.y,player.r,0,Math.PI*2);gctx.fill();gctx.strokeStyle='#bae6fd';gctx.stroke();gctx.restore();
game.obstacles.forEach(drawObstacle);gctx.fillStyle='#94a3b8';gctx.font='13px system-ui';gctx.textAlign='center';gctx.fillText('좌우로 움직여 장애물을 피하세요!',GW/2,28);}
function gameFrame(now){if(game.active){if(!game.last)game.last=now;let dt=Math.min((now-game.last)/1000,.04);game.last=now;game.t+=dt;const baseSpeed=150+Math.min(game.t/35,1)*390;const speed=baseSpeed*(game.difficulty==='hard'?1.5:1);const baseSpawnRate=Math.max(.48,1.25-game.t/55);const spawnRate=baseSpawnRate/(game.difficulty==='hard'?2.5:1);game.spawn-=dt;if(game.spawn<=0){spawnObstacle();game.spawn=spawnRate*(.7+Math.random()*.65);}player.x=Math.max(player.r+5,Math.min(GW-player.r-5,player.x+game.move*player.speed*dt));game.obstacles.forEach(o=>o.y+=speed*dt);game.obstacles=game.obstacles.filter(o=>o.y<GH+80);if(game.obstacles.some(collide))endGame();$('gameTime').textContent=timeText(game.t);}
gameDraw();requestAnimationFrame(gameFrame);}
$('openGame').addEventListener('click',openGame);$('openRanking').addEventListener('click',showRanking);$('closeRanking').addEventListener('click',hideRanking);$('rankEasy').addEventListener('click',()=>loadRanking('easy'));$('rankHard').addEventListener('click',()=>loadRanking('hard'));$('showRankingFromGame').addEventListener('click',showRanking);$('startGame').addEventListener('click',gameStart);$('nicknameInput').addEventListener('keydown',e=>{if(e.key==='Enter')gameStart();});$('easyMode').addEventListener('click',()=>setDifficulty('easy'));$('hardMode').addEventListener('click',()=>setDifficulty('hard'));$('restartGame').addEventListener('click',()=>{ $('gameOverlay').classList.remove('show');$('gameSetup').hidden=false;$('gamePlayArea').hidden=true;game.active=false;});$('exitGame').addEventListener('click',closeGame);$('backToSimulation').addEventListener('click',closeGame);
function setMove(v){game.move=v;}
[['moveLeft',-1],['moveRight',1]].forEach(([id,v])=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();setMove(v);b.setPointerCapture?.(e.pointerId);});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{if(game.move===v)setMove(0);}));});
window.addEventListener('keydown',e=>{if(!gameView.classList.contains('active'))return;if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();setMove(-1);}if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();setMove(1);}});window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))setMove(0);});
requestAnimationFrame(gameFrame);
})();</script></body></html>
